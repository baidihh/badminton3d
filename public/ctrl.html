<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#070b11">
<title>3D 羽毛球手柄</title>
<style>
  :root{--ink:#EEF2F7;--dim:#8FA0B5;--line:rgba(255,255,255,.12);
    --p1:#4DA3FF;--p2:#FF7A5C}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;background:#070b11;
    color:var(--ink);font-family:"PingFang SC","SF Pro Text",system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;user-select:none}
  body{display:flex;flex-direction:column;
    padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 14px)}

  .bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
  .badge{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--dim);
    padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.05);border:1px solid var(--line)}
  .dot{width:7px;height:7px;border-radius:99px;background:#3DDC97;box-shadow:0 0 8px #3DDC97}
  .dot.off{background:#5a6577;box-shadow:none}

  #map{width:100%;height:130px;border-radius:14px;background:#0b121c;
    border:1px solid var(--line);display:block;margin-bottom:12px}

  .stage{flex:1;display:grid;place-items:center;min-height:0}
  .ring{width:min(68vw,250px);aspect-ratio:1;border-radius:50%;
    border:2px solid rgba(255,255,255,.10);display:grid;place-items:center;
    transition:border-color .16s,box-shadow .16s,transform .1s}
  .ring.hot{border-color:rgba(255,255,255,.85);
    box-shadow:0 0 60px rgba(120,200,255,.4),inset 0 0 40px rgba(120,200,255,.16)}
  .ring.hit{transform:scale(1.06);border-color:#3DDC97;box-shadow:0 0 70px rgba(61,220,151,.5)}
  .inner{text-align:center;padding:0 16px}
  .label{font-size:12px;letter-spacing:.16em;color:var(--dim);text-transform:uppercase}
  .big{font-size:40px;font-weight:700;line-height:1.15;margin:4px 0 0}
  .big.hot{color:#BFE4FF}
  .hint{font-size:12px;color:var(--dim);margin-top:8px;line-height:1.5}

  .meter{width:100%;height:6px;border-radius:99px;background:rgba(255,255,255,.08);
    overflow:hidden;margin:14px 0 6px}
  .fill{height:100%;width:0%;border-radius:99px;
    background:linear-gradient(90deg,#4DA3FF,#3DDC97);transition:width .1s ease-out}

  .foot{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:8px}
  .sc{display:flex;align-items:baseline;gap:8px}
  .me{font-size:38px;font-weight:700;font-variant-numeric:tabular-nums;
    font-family:"Inter",sans-serif}
  .t{font-size:20px;color:var(--dim)} .them{font-size:20px;color:var(--dim);
    font-variant-numeric:tabular-nums;font-family:"Inter",sans-serif}
  .right{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
  .btn{font:inherit;font-size:12px;padding:9px 14px;border-radius:11px;cursor:pointer;
    background:rgba(255,255,255,.07);border:1px solid var(--line);color:var(--ink)}
  .tiny{font-size:11px;color:var(--dim);text-align:right;line-height:1.6}

  #gate{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:14px;padding:30px;text-align:center;
    background:rgba(6,10,16,.97);backdrop-filter:blur(8px);transition:opacity .3s}
  #gate.hide{opacity:0;pointer-events:none}
  #gate h2{margin:0;font-size:21px;letter-spacing:.03em}
  #gate p{margin:0;font-size:13px;color:var(--dim);line-height:1.7;max-width:300px}
  .primary{font:inherit;font-size:16px;font-weight:600;padding:16px 34px;border-radius:16px;
    border:1px solid rgba(77,163,255,.45);background:rgba(77,163,255,.16);color:#CFE5FF}
  #gstatus{font-size:12px;color:#EFAA17;min-height:18px}
  .slots{display:flex;gap:10px}
  .slot{font:inherit;font-size:13px;padding:12px 20px;border-radius:12px;cursor:pointer;
    background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--ink)}
  .slot.active{background:rgba(77,163,255,.2);border-color:rgba(77,163,255,.6);color:#BCDDFF}
</style>
</head>
<body>

<div class="bar">
  <div class="badge"><span class="dot off" id="dot"></span><span id="stat">未连接</span></div>
  <div class="badge" id="slotb">未分配</div>
</div>

<canvas id="map"></canvas>

<div class="stage">
  <div class="ring" id="ring">
    <div class="inner">
      <div class="label" id="label">挥拍</div>
      <div class="big" id="big">待机</div>
      <div class="hint" id="hint">像握球拍一样握手机</div>
    </div>
  </div>
</div>

<div class="meter"><div class="fill" id="fill"></div></div>

<div class="foot">
  <div class="sc">
    <div class="me" id="mysc">0</div>
    <div class="t">:</div>
    <div class="them" id="thsc">0</div>
  </div>
  <div class="right">
    <button class="btn" id="swap">切换场地</button>
    <div class="tiny" id="peak">峰值 0.0</div>
  </div>
</div>

<div id="gate">
  <h2>启用手势控制</h2>
  <p>需要访问手机运动传感器才能识别挥拍。</p>
  <div id="gstatus"></div>
  <button class="primary" id="enable">开启传感器</button>
  <div class="slots" id="pick" style="display:none">
    <button class="slot" data-slot="left">左边场地</button>
    <button class="slot" data-slot="right">右边场地</button>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const cfg = { threshold: Number(localStorage.getItem('bm3_threshold') || 13), cooldown: 260 };

const grav = { x: 0, y: 0, z: 0 };
let eventCount = 0, rateWin = [];
const swing = { active: false, start: 0, peak: 0, peakAx: 0 };
let cooldownUntil = 0, lastPeak = 0, sensorOn = false;
let hitFlashUntil = 0;

function classify(e) {
  let ax = 0, mag = 0;
  if (e.acceleration && e.acceleration.x !== null && e.acceleration.x !== undefined) {
    ax = e.acceleration.x;
    mag = Math.hypot(ax, e.acceleration.y || 0, e.acceleration.z || 0);
  } else if (e.accelerationIncludingGravity) {
    const g = e.accelerationIncludingGravity;
    grav.x = grav.x * 0.88 + (g.x || 0) * 0.12;
    grav.y = grav.y * 0.88 + (g.y || 0) * 0.12;
    grav.z = grav.z * 0.88 + (g.z || 0) * 0.12;
    ax = (g.x || 0) - grav.x;
    mag = Math.hypot(ax, (g.y || 0) - grav.y, (g.z || 0) - grav.z);
  }
  return { ax, mag };
}

function onMotion(e) {
  eventCount++;
  const t = performance.now();
  const { ax, mag } = classify(e);

  rateWin.push(t);
  while (rateWin.length && t - rateWin[0] > 1000) rateWin.shift();

  if (swing.active) {
    if (mag > swing.peak) { swing.peak = mag; swing.peakAx = ax; }
    if (mag < cfg.threshold * 0.6 || t - swing.start > 500) {
      swing.active = false;
      fire(swing.peak, swing.peakAx);
    }
  } else if (mag > cfg.threshold && t > cooldownUntil) {
    swing.active = true;
    swing.start = t;
    swing.peak = mag;
    swing.peakAx = ax;
  }
}

function fire(peak, peakAx) {
  cooldownUntil = performance.now() + cfg.cooldown;
  lastPeak = peak;
  const power = Math.max(0, Math.min(1, (peak - 10) / 26));
  const dir = Math.max(-1, Math.min(1, peakAx / 22));

  $('peak').textContent = '峰值 ' + peak.toFixed(1);
  $('fill').style.width = Math.round(power * 100) + '%';
  if (navigator.vibrate) navigator.vibrate(Math.round(12 + power * 30));
  if (socket.connected) socket.emit('ctrl:swing', { power, dir, peak });
  whoosh(power);
}

// ---------- 连接 ----------
const socket = io({ transports: ['websocket', 'polling'] });
let mySlot = null, selSlot = null;

socket.on('connect', () => {
  $('dot').className = 'dot';
  $('stat').textContent = '已连接';
  if (mySlot) socket.emit('ctrl:join', { slot: mySlot });
});
socket.on('disconnect', () => {
  $('dot').className = 'dot off';
  $('stat').textContent = '连接断开';
});
socket.on('ctrl:joined', ({ slot }) => {
  mySlot = slot;
  const el = $('slotb');
  el.textContent = slot === 'left' ? '左边场地' : '右边场地';
  el.style.color = slot === 'left' ? '#4DA3FF' : '#FF7A5C';
  drawMap();
});
socket.on('ctrl:full', () => {
  $('stat').textContent = '场地已满';
  $('dot').className = 'dot off';
});
socket.on('ctrl:released', () => { mySlot = null; $('slotb').textContent = '被接管'; });

socket.on('ctrl:tick', (s) => {
  const me = mySlot === 'left' ? s.l : s.r;
  const other = mySlot === 'left' ? s.r : s.l;
  $('mysc').textContent = me.score;
  $('thsc').textContent = other.score;

  const onMine = mySlot === 'left' ? s.bz < 0 : s.bz > 0;
  const d = Math.hypot(s.bx - me.x, s.by - me.y, s.bz - me.z);

  if (performance.now() < hitFlashUntil) {
    $('ring').className = 'ring hit';
    $('big').textContent = '命中';
    $('big').className = 'big';
    $('hint').textContent = '';
  } else if (s.phase === 'rally' && onMine && d < 1.6) {
    $('ring').className = 'ring hot';
    $('big').textContent = '挥拍!';
    $('big').className = 'big hot';
    $('hint').textContent = '球在你这边';
  } else if (s.phase === 'serve' && s.srv === mySlot) {
    $('ring').className = 'ring hot';
    $('big').textContent = '发球';
    $('big').className = 'big hot';
    $('hint').textContent = '挥拍把球打过网';
  } else if (s.phase === 'over') {
    $('ring').className = 'ring';
    $('big').textContent = me.score > other.score ? '获胜' : '结束';
    $('big').className = 'big';
    $('hint').textContent = '';
  } else {
    $('ring').className = 'ring';
    $('big').textContent = '待机';
    $('big').className = 'big';
    $('hint').textContent = '保持握持，等球过来';
  }

  lastState = s;
  drawMap();
});

// ---------- 俯视小地图 ----------
const map = $('map');
const mctx = map.getContext('2d');
let lastState = null;

function sizeMap() {
  const dpr = Math.min(devicePixelRatio || 1, 2);
  map.width = map.clientWidth * dpr;
  map.height = map.clientHeight * dpr;
  mctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
sizeMap();
addEventListener('resize', sizeMap);

let mapAnim = 0;
function drawMap() {
  const w = map.clientWidth, h = map.clientHeight;
  mctx.clearRect(0, 0, w, h);
  if (!lastState || !mySlot) {
    mctx.fillStyle = 'rgba(255,255,255,.18)';
    mctx.font = '12px sans-serif';
    mctx.textAlign = 'center';
    mctx.fillText('等待分配场地…', w / 2, h / 2);
    return;
  }

  const s = lastState;
  const myColor = mySlot === 'left' ? '#4DA3FF' : '#FF7A5C';
  const otherColor = mySlot === 'left' ? '#FF7A5C' : '#4DA3FF';

  // 场地边框
  const pad = 12;
  const cw = w - pad * 2, ch = h - pad * 2;
  mctx.strokeStyle = 'rgba(255,255,255,.14)';
  mctx.lineWidth = 1;
  mctx.strokeRect(pad, pad, cw, ch);

  // 己方半场高亮（靠下那半）
  mctx.fillStyle = mySlot === 'left' ? 'rgba(77,163,255,.12)' : 'rgba(255,122,92,.12)';
  mctx.fillRect(pad, pad + ch / 2, cw, ch / 2);

  // 网（中间那条）
  mctx.strokeStyle = 'rgba(255,255,255,.55)';
  mctx.lineWidth = 2;
  mctx.beginPath();
  mctx.moveTo(pad, pad + ch / 2);
  mctx.lineTo(pad + cw, pad + ch / 2);
  mctx.stroke();

  const toX = (x) => pad + ((x + 3) / 6) * cw;
  const toY = (z) => {
    const t = mySlot === 'left' ? (z + 6.7) / 13.4 : (6.7 - z) / 13.4;
    return pad + (1 - t) * ch;
  };

  // 对手
  const op = mySlot === 'left' ? s.r : s.l;
  mctx.fillStyle = otherColor;
  mctx.beginPath(); mctx.arc(toX(op.x), toY(op.z), 4, 0, Math.PI * 2); mctx.fill();

  // 我
  const me = mySlot === 'left' ? s.l : s.r;
  mctx.fillStyle = myColor;
  mctx.beginPath(); mctx.arc(toX(me.x), toY(me.z), 5.5, 0, Math.PI * 2); mctx.fill();

  // 球
  const bx = toX(s.bx), by = toY(s.bz);
  mctx.fillStyle = '#F7FAFF';
  mctx.beginPath(); mctx.arc(bx, by, 3.4, 0, Math.PI * 2); mctx.fill();

  // 球高度环
  const alt = Math.min(1, s.by / 3.5);
  mctx.strokeStyle = 'rgba(247,250,255,' + (0.55 - alt * 0.4) + ')';
  mctx.lineWidth = 1;
  mctx.beginPath(); mctx.arc(bx, by, 6 + alt * 12, 0, Math.PI * 2); mctx.stroke();

  // 我的半场方向提示
  mctx.fillStyle = 'rgba(255,255,255,.28)';
  mctx.font = '10px sans-serif';
  mctx.textAlign = 'center';
  mctx.fillText('▲ 球网', w / 2, pad + 13);
}
drawMap();

// 命中反馈（本地近似）
setInterval(() => {
  if (!lastState || !mySlot) return;
  const me = mySlot === 'left' ? lastState.l : lastState.r;
  const d = Math.hypot(lastState.bx - me.x, lastState.by - me.y, lastState.bz - me.z);
  if (d < 1.0) hitFlashUntil = performance.now() + 200;
}, 60);

// ---------- 音效 ----------
let ac = null;
function whoosh(power) {
  try {
    if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === 'suspended') ac.resume();
    const dur = 0.13;
    const buf = ac.createBuffer(1, Math.floor(ac.sampleRate * dur), ac.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) {
      const k = i / d.length;
      d[i] = (Math.random() * 2 - 1) * Math.pow(1 - k, 3) * (0.22 + power * 0.33);
    }
    const src = ac.createBufferSource(); src.buffer = buf;
    const bp = ac.createBiquadFilter(); bp.type = 'bandpass';
    bp.frequency.value = 700 + power * 1600; bp.Q.value = 1.4;
    const g = ac.createGain(); g.gain.value = 0.55;
    src.connect(bp).connect(g).connect(ac.destination);
    src.start(ac.currentTime);
  } catch {}
}

// ---------- 授权 ----------
async function enableSensors() {
  const st = $('gstatus');
  st.textContent = '正在请求权限…';
  try {
    if (typeof DeviceMotionEvent === 'undefined') {
      st.textContent = '此浏览器不支持运动传感器';
      return;
    }
    if (typeof DeviceMotionEvent.requestPermission === 'function') {
      const r = await DeviceMotionEvent.requestPermission();
      if (r !== 'granted') {
        st.textContent = '权限被拒绝。设置 → Safari → 动作与方向';
        return;
      }
    }
    addEventListener('devicemotion', onMotion);
    sensorOn = true;

    try { if ('wakeLock' in navigator) await navigator.wakeLock.request('screen'); } catch {}

    setTimeout(() => {
      if (eventCount === 0) {
        st.textContent = '未收到传感器事件，请确认用 HTTPS 打开';
        st.style.color = '#E8463A';
        return;
      }
      $('gate').classList.add('hide');
      socket.emit('ctrl:join', { slot: selSlot });
      setInterval(() => {
        if (socket.connected) socket.emit('ctrl:motion', { rate: rateWin.length, events: eventCount });
      }, 1000);
    }, 900);
  } catch (e) {
    st.textContent = '授权失败：' + (e && e.message ? e.message : e);
  }
}
$('enable').onclick = enableSensors;

document.querySelectorAll('.slot').forEach((b) => {
  b.onclick = () => {
    selSlot = b.dataset.slot;
    document.querySelectorAll('.slot').forEach((x) => x.classList.remove('active'));
    b.classList.add('active');
    if (sensorOn && socket.connected) { mySlot = selSlot; socket.emit('ctrl:join', { slot: selSlot }); }
  };
});

$('swap').onclick = () => {
  mySlot = mySlot === 'left' ? 'right' : 'left';
  socket.emit('ctrl:join', { slot: mySlot });
};

document.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });
document.addEventListener('gesturestart', (e) => e.preventDefault());
</script>
</body>
</html>
